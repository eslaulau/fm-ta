name: FM27 EngineDividend 4Back 2.6 Project Build
on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/2.6_TRIGGER.json"

permissions:
  contents: write

jobs:
  build-project-tactic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "04_离线原生FMF生成器/requirements.txt"

      - name: Install native generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"

      - name: Restore and verify immutable V0.5 parent
        run: python "tactic_development/FM27_EngineDividend_4Back/materialize_v05_baseline.py"

      - name: Clear prior generated outputs for this version
        run: rm -f "tactic_development/FM27_EngineDividend_4Back/builds/2.6.fmf" "tactic_development/FM27_EngineDividend_4Back/builds/2.6.report.json"

      - name: Print exact SHA-256 inputs for audit pinning
        run: |
          sha256sum \
            "tactic_development/FM27_EngineDividend_4Back/2.6.json" \
            "tactic_development/FM27_EngineDividend_4Back/PROJECT_RULES.md" \
            "tactic_development/FM27_EngineDividend_4Back/TACTIC_INSTRUCTION_DECISION_LEDGER.md" \
            "tactic_development/FM27_EngineDividend_4Back/PPG_TARGET_POLICY.json" \
            "tactic_development/FM27_EngineDividend_4Back/POSITION_PERFORMANCE_ELIMINATION_STANDARD.md"

      - name: Run project gate, native preflight, build and independent readback
        run: |
          python "tactic_development/FM27_EngineDividend_4Back/build_project_tactic.py" \
            --recipe "tactic_development/FM27_EngineDividend_4Back/2.6.json" \
            --audit "tactic_development/FM27_EngineDividend_4Back/2.6_DESIGN_AND_AUDIT.md" \
            --parent-fmf "tactic_development/FM27_EngineDividend_4Back/builds/V0.5.fmf" \
            --output "tactic_development/FM27_EngineDividend_4Back/builds/2.6.fmf" \
            --report "tactic_development/FM27_EngineDividend_4Back/builds/2.6.report.json"

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: FM27-EngineDividend-4Back-2.6-D3
          path: |
            tactic_development/FM27_EngineDividend_4Back/builds/2.6.fmf
            tactic_development/FM27_EngineDividend_4Back/builds/2.6.report.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit D3 outputs into the project archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tactic_development/FM27_EngineDividend_4Back/builds/2.6.fmf" "tactic_development/FM27_EngineDividend_4Back/builds/2.6.report.json"
          if git diff --cached --quiet; then
            echo "D3 outputs are byte-identical to the archived files; no commit is required."
          else
            git commit -m "Build FM27 EngineDividend 4Back 2.6 D3"
            git push
          fi
