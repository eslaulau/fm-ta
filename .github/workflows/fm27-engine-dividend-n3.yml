name: FM27 EngineDividend 4Back N3 D3 Build

on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/N3_TRIGGER.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-n3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "04_离线原生FMF生成器/requirements.txt"

      - name: Install native generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"

      - name: Restore immutable V0.5 native carrier
        run: python "tactic_development/FM27_EngineDividend_4Back/materialize_v05_baseline.py"

      - name: Native preflight, structure check, FMF build and independent readback
        run: |
          python "tactic_development/FM27_EngineDividend_4Back/build_project_tactic.py" \
            --recipe "tactic_development/FM27_EngineDividend_4Back/N3.json" \
            --audit "tactic_development/FM27_EngineDividend_4Back/N3_DESIGN_AND_AUDIT.md" \
            --parent-fmf "tactic_development/FM27_EngineDividend_4Back/builds/N2.fmf" \
            --output "tactic_development/FM27_EngineDividend_4Back/builds/N3.fmf" \
            --report "tactic_development/FM27_EngineDividend_4Back/builds/N3.report.json"

      - name: Upload N3 D3 package
        uses: actions/upload-artifact@v4
        with:
          name: FM27-EngineDividend-4Back-N3-D3
          path: |
            tactic_development/FM27_EngineDividend_4Back/N3.json
            tactic_development/FM27_EngineDividend_4Back/N3_DESIGN_AND_AUDIT.md
            tactic_development/FM27_EngineDividend_4Back/builds/N3.fmf
            tactic_development/FM27_EngineDividend_4Back/builds/N3.report.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit N3 build outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add "tactic_development/FM27_EngineDividend_4Back/builds/N3.fmf" "tactic_development/FM27_EngineDividend_4Back/builds/N3.report.json"
          git commit -m "Build FM27 EngineDividend 4Back N3 D3" || echo "No output changes to commit"
          git push
