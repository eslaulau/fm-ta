name: FM27 EngineDividend 4Back R5.1 Project Build
on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/R5.1_TRIGGER.json"
permissions:
  contents: write
jobs:
  build-project-tactic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "04_离线原生FMF生成器/requirements.txt"
      - name: Install native generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"
      - name: Restore immutable V0.5 baseline
        run: python "tactic_development/FM27_EngineDividend_4Back/materialize_v05_baseline.py"
      - name: Pin and generate machine decision manifest
        run: python "tactic_development/FM27_EngineDividend_4Back/prepare_R5_1_audit.py"
      - name: Build through project gate, native preflight and independent readback
        run: |
          python "tactic_development/FM27_EngineDividend_4Back/build_project_tactic.py" \
            --recipe "tactic_development/FM27_EngineDividend_4Back/R5.1.json" \
            --audit "tactic_development/FM27_EngineDividend_4Back/R5.1_DESIGN_AND_AUDIT.md" \
            --parent-fmf "tactic_development/FM27_EngineDividend_4Back/builds/V0.5.fmf" \
            --output "tactic_development/FM27_EngineDividend_4Back/builds/R5.1.fmf" \
            --report "tactic_development/FM27_EngineDividend_4Back/builds/R5.1.report.json"
      - name: Upload verified R5.1 FMF
        uses: actions/upload-artifact@v4
        with:
          name: FM27-EngineDividend-4Back-R5.1-D3
          path: |
            tactic_development/FM27_EngineDividend_4Back/builds/R5.1.fmf
            tactic_development/FM27_EngineDividend_4Back/builds/R5.1.report.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit pinned audit and D3 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tactic_development/FM27_EngineDividend_4Back/R5.1_DESIGN_AND_AUDIT.md" "tactic_development/FM27_EngineDividend_4Back/builds/R5.1.fmf" "tactic_development/FM27_EngineDividend_4Back/builds/R5.1.report.json"
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Build FM27 EngineDividend 4Back R5.1 D3"; git push; fi
