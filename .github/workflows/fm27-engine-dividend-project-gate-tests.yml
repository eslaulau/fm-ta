name: FM27 EngineDividend Project Gate Regression Tests
on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/PROJECT_GATE_TEST_TRIGGER.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run project gate regression suite
        run: |
          python -m unittest discover \
            -s tactic_development/FM27_EngineDividend_4Back \
            -p "test_project_iteration_gate.py" -v
