name: FM27 Native Tactics Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "00_资料总索引与检索规范.md"
      - "01_网站生成规则/**"
      - "02_FM27原生权限规则/**"
      - "03_GEN1编码与导入规则/**"
      - "04_离线原生FMF生成器/**"
      - "[1-9].fmf"
      - "10.fmf"
      - "tests/**"
      - ".github/workflows/fm27-native-tactics-regression.yml"
  pull_request:
    paths:
      - "README.md"
      - "00_资料总索引与检索规范.md"
      - "01_网站生成规则/**"
      - "02_FM27原生权限规则/**"
      - "03_GEN1编码与导入规则/**"
      - "04_离线原生FMF生成器/**"
      - "[1-9].fmf"
      - "10.fmf"
      - "tests/**"
      - ".github/workflows/fm27-native-tactics-regression.yml"

permissions:
  contents: read

jobs:
  native-tactics-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"
      - name: Compile generator, audit scripts, and tests
        run: python -m compileall -q "04_离线原生FMF生成器" tests
      - name: Audit all ten uploaded native FMF samples
        run: python "04_离线原生FMF生成器/FM27GEN1_Audit_Uploaded_Style_Samples.py"
      - name: Self-test installed preset archive reader
        run: python "04_离线原生FMF生成器/FM27GEN1_Extract_Installed_Presets.py" --self-test
      - name: Audit all 90 website preset index rows
        run: |
          python "04_离线原生FMF生成器/FM27GEN1_Netlify90_OfficialPreset_Audit.py" --output "$RUNNER_TEMP/netlify90_official_preset_audit.json"
      - name: Run FM27GEN1 regression tests
        run: python -m unittest discover -s tests -p "test_fm27gen1_*.py" -v
      - name: Audit all native style templates
        run: |
          python "04_离线原生FMF生成器/FM27GEN1_StyleTemplate_Audit.py" --root "." --output "$RUNNER_TEMP/style_template_audit.json"
          python - "$RUNNER_TEMP/style_template_audit.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["error_count"] == 0, report.get("errors")
          styles = {x["style"] for x in report["style_coverage"]}
          assert len(styles) == 10, styles
          print("PASS: all ten native styles are registered and audited")
          PY
      - name: Generate and independently read back Control Possession smoke test
        run: |
          python "04_离线原生FMF生成器/FM27GEN1_Offline_FMF_Generator.py" \
            "tests/fixtures/FM27_Control_Possession_SmokeTest_GEN1.txt" \
            --catalog "04_离线原生FMF生成器/catalog.json" \
            --output "$RUNNER_TEMP/Control_Possession_SmokeTest.fmf" \
            --report "$RUNNER_TEMP/Control_Possession_SmokeTest.report.json"
          python - "$RUNNER_TEMP/Control_Possession_SmokeTest.report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "offline_binary_roundtrip_verified_not_game_import_verified", report
          assert report["checks"]["22_positions_roles_pi_readback_exact"] is True, report
          assert report["checks"]["pi_permissions_checked_against_catalog"] is True, report
          print("PASS: native FMF generation and independent binary readback")
      - name: Upload generated native FMF and readback report
        uses: actions/upload-artifact@v4
        with:
          name: FM27_Random_Trial_20261118
          path: |
            ${{ runner.temp }}/Control_Possession_SmokeTest.fmf
            ${{ runner.temp }}/Control_Possession_SmokeTest.report.json
          if-no-files-found: error
          retention-days: 14
          PY
