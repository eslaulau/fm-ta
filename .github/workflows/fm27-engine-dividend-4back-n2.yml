name: FM27 EngineDividend 4Back N2 Build
on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/N2_TRIGGER.json"
permissions:
  contents: write
jobs:
  build-n2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "04_离线原生FMF生成器/requirements.txt"
      - name: Install native generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"
      - name: Restore immutable V0.5 native carrier
        run: python "tactic_development/FM27_EngineDividend_4Back/materialize_v05_baseline.py"
      - name: Native preflight, structure check, FMF build and independent readback
        run: |
          python "tactic_development/FM27_EngineDividend_4Back/build_project_tactic.py" \
            --recipe "tactic_development/FM27_EngineDividend_4Back/N2.json" \
            --audit "tactic_development/FM27_EngineDividend_4Back/N2_DESIGN_AND_AUDIT.md" \
            --parent-fmf "tactic_development/FM27_EngineDividend_4Back/builds/N1.fmf" \
            --output "tactic_development/FM27_EngineDividend_4Back/builds/N2.fmf" \
            --report "tactic_development/FM27_EngineDividend_4Back/builds/N2.report.json"
      - name: Upload N2 D3 package
        uses: actions/upload-artifact@v4
        with:
          name: FM27-EngineDividend-4Back-N2-D3
          path: |
            tactic_development/FM27_EngineDividend_4Back/N2.json
            tactic_development/FM27_EngineDividend_4Back/N2_DESIGN_AND_AUDIT.md
            tactic_development/FM27_EngineDividend_4Back/builds/N2.fmf
            tactic_development/FM27_EngineDividend_4Back/builds/N2.report.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit N2 build outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add "tactic_development/FM27_EngineDividend_4Back/builds/N2.fmf" "tactic_development/FM27_EngineDividend_4Back/builds/N2.report.json"
          git commit -m "Build FM27 EngineDividend 4Back N2 D3"
          git push
