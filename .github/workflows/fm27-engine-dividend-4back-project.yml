name: FM27 EngineDividend 4Back Project Build

on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/2.3_TRIGGER.json"

permissions:
  contents: read

jobs:
  build-v05-reset-tactic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Read project build request
        id: request
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path("tactic_development/FM27_EngineDividend_4Back/2.3_TRIGGER.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          for key in ("version", "recipe", "audit"):
              print(f"{key}={d[key]}")
          print(f"stem=FM27_EngineDividend_4Back_{d['version']}")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "04_离线原生FMF生成器/requirements.txt"

      - name: Install native generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"

      - name: Restore and verify exact V0.5 baseline
        run: |
          python "tactic_development/FM27_EngineDividend_4Back/materialize_v05_baseline.py"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("tactic_development/FM27_EngineDividend_4Back/builds/V0.5.fmf")
          expected = "e9a82cf273187b20567c38e25f362e7aed4e2a38ac525789c69d7abf641c7257"
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"V0.5 SHA mismatch: {actual}")
          print(f"PASS V0.5: {p.stat().st_size} bytes / {actual}")
          PY

      - name: Run project gate, native permission preflight, build and D3 readback
        run: |
          python "tactic_development/FM27_EngineDividend_4Back/build_project_tactic.py" \
            --recipe "tactic_development/FM27_EngineDividend_4Back/${{ steps.request.outputs.recipe }}" \
            --audit "tactic_development/FM27_EngineDividend_4Back/${{ steps.request.outputs.audit }}" \
            --parent-fmf "tactic_development/FM27_EngineDividend_4Back/builds/V0.5.fmf" \
            --output "tactic_development/FM27_EngineDividend_4Back/builds/${{ steps.request.outputs.stem }}.fmf" \
            --report "tactic_development/FM27_EngineDividend_4Back/builds/${{ steps.request.outputs.stem }}.report.json"

      - name: Upload FMF and same-run report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.stem }}
          path: |
            tactic_development/FM27_EngineDividend_4Back/builds/${{ steps.request.outputs.stem }}.fmf
            tactic_development/FM27_EngineDividend_4Back/builds/${{ steps.request.outputs.stem }}.report.json
          if-no-files-found: error
          retention-days: 30
