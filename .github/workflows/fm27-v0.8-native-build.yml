name: FM27 V0.8 Native Snapshot Build
on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/V0.8.json"
      - "tactic_development/FM27_EngineDividend_4Back/V0.7.fmf"
      - "scripts/build_fm27_snapshot_tactic.py"
      - "04_离线原生FMF生成器/FM27GEN1_Offline_FMF_Generator.py"
      - "04_离线原生FMF生成器/catalog.json"
permissions:
  contents: read
jobs:
  build-v08:
    name: Build V0.8 from exact V0.7 native snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"
      - name: Build V0.8 from exact V0.7 parent
        run: |
          python scripts/build_fm27_snapshot_tactic.py \
            --request tactic_development/FM27_EngineDividend_4Back/V0.8.json \
            --output "${{ runner.temp }}/FM27_EngineDividend_IP_4Back_V0.8.fmf" \
            --report "${{ runner.temp }}/FM27_EngineDividend_IP_4Back_V0.8.report.json"
      - name: Enforce native readback report
        run: |
          python - "${{ runner.temp }}/FM27_EngineDividend_IP_4Back_V0.8.report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          failed = [name for name, passed in report["checks"].items() if passed is not True]
          if failed:
              raise SystemExit("Native snapshot readback checks failed: " + ", ".join(failed))
          if report["status"] != "offline_binary_roundtrip_verified_not_game_import_verified":
              raise SystemExit("Unexpected build status")
          PY
      - name: Upload V0.8 FMF and report
        uses: actions/upload-artifact@v4
        with:
          name: FM27_EngineDividend_IP_4Back_V0.8_run${{ github.run_number }}
          path: |
            ${{ runner.temp }}/FM27_EngineDividend_IP_4Back_V0.8.fmf
            ${{ runner.temp }}/FM27_EngineDividend_IP_4Back_V0.8.report.json
          if-no-files-found: error
          retention-days: 14
