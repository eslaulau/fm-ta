name: FM27 EngineDividend 4Back N8 Three-Line Combo D3 Build

on:
  push:
    branches: [main]
    paths:
      - "tactic_development/FM27_EngineDividend_4Back/N8_TRIGGER.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-n8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "04_离线原生FMF生成器/requirements.txt"
      - name: Install native generator dependencies
        run: python -m pip install -r "04_离线原生FMF生成器/requirements.txt"
      - name: Restore immutable V0.5 native carrier
        run: python "tactic_development/FM27_EngineDividend_4Back/materialize_v05_baseline.py"
      - name: Download actual N3 parent FMF from successful D3 artifact
        uses: actions/download-artifact@v4
        with:
          name: FM27-EngineDividend-4Back-N3-D3
          run-id: 45967024574
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/n3-parent
      - name: Verify N3 parent hash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          candidates = list(Path("/tmp/n3-parent").rglob("N3.fmf"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one N3.fmf, found {len(candidates)}: {candidates}")
          data = candidates[0].read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          expected = "a28c32350f5923b98a37a428debacc12e1d4d83838248fca9cc919e9d5671dcf"
          if digest != expected:
              raise SystemExit(f"N3 parent SHA mismatch: {digest}")
          Path("tactic_development/FM27_EngineDividend_4Back/builds/N3_parent.fmf").write_bytes(data)
          print(f"N3 parent verified: {len(data)} bytes, SHA256={digest}")
          PY
      - name: Native preflight, structure check, FMF build and independent readback
        run: |
          python "tactic_development/FM27_EngineDividend_4Back/build_project_tactic.py" \
            --recipe "tactic_development/FM27_EngineDividend_4Back/N8.json" \
            --audit "tactic_development/FM27_EngineDividend_4Back/N8_DESIGN_AND_AUDIT.md" \
            --parent-fmf "tactic_development/FM27_EngineDividend_4Back/builds/N3_parent.fmf" \
            --output "tactic_development/FM27_EngineDividend_4Back/builds/N8.fmf" \
            --report "tactic_development/FM27_EngineDividend_4Back/builds/N8.report.json"
      - name: Upload N8 D3 package
        uses: actions/upload-artifact@v4
        with:
          name: FM27-EngineDividend-4Back-N8-D3
          path: |
            tactic_development/FM27_EngineDividend_4Back/N8.json
            tactic_development/FM27_EngineDividend_4Back/N8_DESIGN_AND_AUDIT.md
            tactic_development/FM27_EngineDividend_4Back/builds/N8.fmf
            tactic_development/FM27_EngineDividend_4Back/builds/N8.report.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit N8 build outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add "tactic_development/FM27_EngineDividend_4Back/builds/N8.fmf" "tactic_development/FM27_EngineDividend_4Back/builds/N8.report.json" "tactic_development/FM27_EngineDividend_4Back/builds/N3_parent.fmf"
          git commit -m "Build FM27 EngineDividend 4Back N8 three-line combo D3" || echo "No output changes to commit"
          git push
